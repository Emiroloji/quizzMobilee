spring:
  application:
    name: soruhavuzu-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  flyway:
    # Altyapı tabloları ve Flyway geçmişi platform şemasında (ADR 0014)
    default-schema: platform
    create-schemas: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema: platform

logging:
  structured:
    # mimari.md §18 alanları; local ve test profilleri insan-okur biçimi kullanır
    format:
      console: com.soruhavuzu.shared.logging.JsonLogFormatter

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # modulith (modül yapısı) yalnızca local profilde açılır
        include: health,info

springdoc:
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

soruhavuzu:
  logging:
    user-id-hash-key: ${LOG_USER_ID_HASH_KEY:}
  identity:
    token:
      provider: cognito
      issuer-uri: ${COGNITO_ISSUER_URI:}
      client-ids: ${COGNITO_CLIENT_IDS:}
  practice:
    attempt-partitions:
      months-ahead: 3
      cron: "0 0 3 * * *"
