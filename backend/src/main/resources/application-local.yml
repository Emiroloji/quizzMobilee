# Lokal geliştirme: docker-compose Postgres + sahte JWT üretici (ADR 0018)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/soruhavuzu
    username: soruhavuzu
    password: soruhavuzu

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  structured:
    format:
      console: ""

soruhavuzu:
  logging:
    user-id-hash-key: yerel-gelistirme-anahtari-gizli-degil
  web:
    allowed-origins: http://localhost:5173,http://localhost:8081
  identity:
    token:
      provider: local
      issuer-uri: https://auth.local.soruhavuzu.invalid
      audiences: http://localhost:8080
      client-ids: local-mobile,local-admin
