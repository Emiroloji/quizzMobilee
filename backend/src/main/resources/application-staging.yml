# Değerler Dokploy ortam değişkenlerinden gelir (ADR 0023)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

soruhavuzu:
  web:
    allowed-origins: ${ALLOWED_ORIGINS}

# Beta herkese açık; API belgesi ve Swagger UI prod'daki gibi kapalı (yerelde local profilde açık)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
