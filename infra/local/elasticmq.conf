include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  media-in {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "media-in-dlq", maxReceiveCount = 3 }
  }
  media-in-dlq {}
  media-results {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "media-results-dlq", maxReceiveCount = 5 }
  }
  media-results-dlq {}
}
